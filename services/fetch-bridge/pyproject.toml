[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-fetch-bridge"
version = "0.1.0"
description = "Bounded signed Fetch transport for independently operated GENESIS specialists"
requires-python = ">=3.11,<3.14"
dependencies = ["uagents==0.26.1", "uagents-core==0.4.12", "aiohttp==3.14.5", "pydantic==2.14.1"]

[project.scripts]
genesis-fetch-bridge = "genesis_fetch_bridge.__main__:main"

[tool.setuptools.packages.find]
include = ["genesis_fetch_bridge*"]
