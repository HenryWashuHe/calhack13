[package]
name = "genesis-forge"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "Checkpointed source-to-verified-capability pipeline for GENESIS"

[dependencies]
genesis-core = { path = "../genesis-core" }
genesis-apify = { path = "../genesis-apify" }
genesis-verification = { path = "../genesis-verification" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
sha2 = "0.10"
url = "2"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream", "json"] }
tokio = { version = "1", features = ["macros", "rt", "time"] }

[[bin]]
name = "genesis-forge"
path = "src/main.rs"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "sync", "time"] }
