[package]
name = "genesis-fetch"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap = { version = "4", features = ["derive", "env"] }
genesis-verification = { path = "../genesis-verification" }
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
# Native JSON permits finite floats. Durable requests must preserve their f64
# value when decoded again, including via genesis-verification's strict decoder.
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
axum.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "io-util"] }
