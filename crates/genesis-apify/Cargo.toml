[package]
name = "genesis-apify"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "Pinned Apify execution and trusted provider receipts for GENESIS"

[dependencies]
genesis-verification = { path = "../genesis-verification" }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "sync"] }
