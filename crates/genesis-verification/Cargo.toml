[package]
name = "genesis-verification"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "Scoped capability acceptance for the GENESIS organization runtime"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"

[[bin]]
name = "genesis-verify"
path = "src/main.rs"
