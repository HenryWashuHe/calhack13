[workspace]
resolver = "2"
members = [
    "crates/genesis-apify",
    "crates/genesis-core",
    "crates/genesis-creao",
    "crates/genesis-elastic",
    "crates/genesis-forge",
    "crates/genesis-fetch",
    "crates/genesis-planner",
    "crates/genesis-planner-eval",
    "crates/genesis-providers",
    "crates/genesis-server",
    "crates/genesis-verification",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
publish = false

[workspace.dependencies]
genesis-core = { path = "crates/genesis-core" }
genesis-providers = { path = "crates/genesis-providers" }
genesis-elastic = { path = "crates/genesis-elastic" }

anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
schemars = { version = "0.8", features = ["chrono", "preserve_order"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
